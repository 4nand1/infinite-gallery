<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anand — Full-Stack Developer</title>
<meta name="description" content="Anand, full-stack developer from Ulaanbaatar, Mongolia. An infinite gallery of projects.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;background:#000;color:#eee;font-family:"JetBrains Mono",ui-monospace,monospace;overflow:hidden;overscroll-behavior:none}
  canvas{display:block;touch-action:none}
  .hud{position:fixed;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#777;pointer-events:none;z-index:2}
  .tl{top:16px;left:16px}.tr{top:16px;right:16px;text-align:right}.tr b{color:#fff;display:block}
  .bl{bottom:16px;left:16px}
  #card{position:fixed;left:16px;bottom:56px;width:min(300px,calc(100% - 32px));border:1px solid #fff;background:#000c;padding:12px 14px;z-index:2;pointer-events:none;transition:opacity .3s}
  #card small{font-size:10px;letter-spacing:.2em;color:#888;text-transform:uppercase}
  #card div{font-size:15px;font-weight:700;margin-top:6px;color:#fff}
  #intro{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:16px;background:radial-gradient(#000a,#000e);z-index:3;transition:opacity .6s}
  #intro.off,#card.off{opacity:0;pointer-events:none}
  #intro img{width:96px;height:96px;border-radius:50%;border:2px solid #fff;object-fit:cover}
  #intro h1{font-size:clamp(36px,8vw,64px);letter-spacing:.08em;margin:18px 0 6px;text-transform:uppercase}
  #intro h2{font-size:12px;letter-spacing:.3em;color:#999;font-weight:400;text-transform:uppercase}
  #intro p{max-width:520px;margin:20px auto 32px;color:#bbb;font-size:14px;line-height:1.7}
  #intro button{background:none;border:0;color:#888;font:inherit;font-size:11px;letter-spacing:.3em;cursor:pointer;animation:pulse 2s infinite}
  @keyframes pulse{50%{color:#fff}}
  #modal{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:#000b;z-index:4}
  #modal[hidden]{display:none}
  #modal article{width:min(560px,100%);max-height:90vh;overflow:auto;border:1px solid #fff;background:#050505;padding:28px}
  #modal small{font-size:11px;letter-spacing:.25em;color:#888}
  #modal h3{font-size:28px;margin:10px 0 4px}
  #modal .sub{color:#999;font-size:13px}
  #modal p{color:#ccc;line-height:1.7;margin:18px 0;font-size:14px}
  #modal ul{list-style:none;padding:0;display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
  #modal li{border:1px solid #444;padding:4px 10px;font-size:12px;color:#ccc}
  #modal .links{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
  #modal a,#modal button{color:#000;background:#fff;border:1px solid #fff;padding:10px 16px;font:inherit;font-size:12px;letter-spacing:.15em;text-transform:uppercase;text-decoration:none;cursor:pointer}
  #modal button{background:none;color:#fff}
  #modal .hint{display:block;margin-top:18px;font-size:10px;letter-spacing:.2em;color:#555}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  @media (max-width:600px){.bl{display:none}#card{bottom:16px}}
</style>
</head>
<body>
<div class="hud tl">Infinite_gallery</div>
<div class="hud tr"><b id="hudName"></b><span id="hudTitle"></span></div>
<div class="hud bl"><span id="hudCount"></span> panels · looping<br>scroll to travel · click left or right wall</div>
<div id="card" class="off"><small></small><div></div></div>

<section id="intro">
  <div>
    <img id="avatar" alt="">
    <h1 id="name"></h1>
    <h2 id="title"></h2>
    <p id="bio"></p>
    <button id="enter">Scroll to enter ↓</button>
  </div>
</section>

<div id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <article>
    <small id="mKind"></small>
    <h3 id="mTitle"></h3>
    <div class="sub" id="mSub"></div>
    <p id="mBody"></p>
    <ul id="mTags"></ul>
    <div class="links" id="mLinks"></div>
    <span class="hint">Esc or click outside to return</span>
  </article>
</div>

<main class="sr" id="sr"></main>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
